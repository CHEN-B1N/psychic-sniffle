<style>
:root{
  --green:#1F6B3A; --green-2:#2E8B57; --soft:#EAF3EC; --soft2:#F3F8F4;
  --bg:#F4F6F4; --card:#FFFFFF; --text:#161A16; --muted:#6E756E;
  --line:#E4E8E4; --warn:#B03A2E; --shadow:0 1px 2px rgba(16,40,24,.06), 0 6px 18px rgba(16,40,24,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --soft:#20301F; --soft2:#1B241C; --bg:#111512; --card:#1A201B;
    --text:#ECEFEC; --muted:#9AA39B; --line:#2B332C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    --green:#5FBE84; --green-2:#4FA874;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
header{
  position:sticky; top:0; z-index:20;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line);
}
header h1{margin:0; font-size:19px; letter-spacing:.2px; font-weight:700}
header .sub{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
main{padding:14px 14px 20px; max-width:640px; margin:0 auto}
.tab{display:none}
.tab.on{display:block; animation:fade .18s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}

.card{
  background:var(--card); border-radius:16px; padding:15px 16px;
  box-shadow:var(--shadow); margin-bottom:12px; border:1px solid var(--line);
}
.card h2{margin:0 0 10px; font-size:15px; font-weight:700; color:var(--green); display:flex; justify-content:space-between; align-items:center}
.card h2 small{font-weight:500; color:var(--muted); font-size:12px}
.hint{font-size:12.5px; color:var(--muted); line-height:1.6; margin:8px 0 0}

.hero{
  background:linear-gradient(150deg,#1F6B3A,#2E8B57); color:#fff;
  border-radius:18px; padding:18px; margin-bottom:12px; box-shadow:0 8px 24px rgba(31,107,58,.25);
}
.hero .tag{display:inline-block; font-size:12px; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:999px; margin-bottom:8px}
.hero h2{margin:0; font-size:20px; font-weight:700; color:#fff}
.hero p{margin:6px 0 0; font-size:13px; opacity:.92}

.meal{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0; padding-bottom:2px}
.meal .when{flex:0 0 46px; font-size:12.5px; color:var(--green); font-weight:700; padding-top:1px}
.meal .what{flex:1; min-width:0}
.meal .what b{display:block; font-size:14.5px; font-weight:600; margin-bottom:1px}
.meal .what span{display:block; font-size:12.5px; color:var(--muted); line-height:1.5}
.meal .kcal{flex:0 0 54px; text-align:right; font-size:12px; color:var(--muted); line-height:1.5}
.meal .kcal b{display:block; color:var(--text); font-size:13px; font-weight:600}

.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; margin:0 -14px; padding-left:14px; padding-right:14px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; width:auto; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--muted); font-size:13.5px; font-weight:600; touch-action:manipulation;
  white-space:nowrap;
}
.chip.on{background:var(--green); border-color:var(--green); color:#fff}

details{border:1px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:10px; overflow:hidden}
details summary{
  list-style:none; padding:14px 16px; font-size:15px; font-weight:600; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›"; color:var(--muted); font-size:20px; transform:rotate(90deg); transition:transform .2s}
details[open] summary::after{transform:rotate(-90deg)}
details[open] summary{border-bottom:1px solid var(--line); color:var(--green)}
.rbody{padding:12px 16px 16px; font-size:14px; line-height:1.65}
.rbody .lab{display:inline-block; font-size:12px; font-weight:700; color:var(--green); margin:6px 0 2px}
.rbody ol{margin:4px 0 0; padding-left:20px}
.rbody ol li{margin-bottom:5px}
.rbody .foot{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted)}

.row{display:flex; gap:10px}
.field{flex:1; min-width:0}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600}
input[type=number], input[type=date], textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line);
  background:var(--soft2); color:var(--text); font-size:16px; font-family:inherit;
  -webkit-appearance:none; appearance:none;
}
textarea{font-size:13px; line-height:1.5; resize:vertical; min-height:80px; font-family:ui-monospace,Menlo,monospace}
input:focus, textarea:focus{outline:2px solid var(--green); outline-offset:-1px}
button{
  font-family:inherit; font-size:15px; font-weight:600; border:0; border-radius:12px;
  padding:13px 18px; background:var(--green); color:#fff; touch-action:manipulation;
  transition:transform .08s, opacity .12s; cursor:pointer; width:100%;
}
button:active{transform:scale(.985); opacity:.9}
button.ghost{background:transparent; color:var(--green); border:1px solid var(--line)}
button.sm{padding:9px 14px; font-size:13.5px; width:auto}

.stat{display:flex; gap:10px; margin-bottom:12px}
.stat .box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:15px; padding:13px 14px; box-shadow:var(--shadow)}
.stat .box .k{font-size:11.5px; color:var(--muted); font-weight:600}
.stat .box .v{font-size:24px; font-weight:700; letter-spacing:-.5px; margin-top:2px}
.stat .box .v small{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0}
.up{color:var(--warn)} .down{color:var(--green)}

canvas{width:100%; height:auto; display:block}

.shopitem{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.shopitem:last-child{border-bottom:0}
.shopitem .nm{flex:1; min-width:0; font-size:14px}
.shopitem .nm span{display:block; font-size:11.5px; color:var(--muted); margin-top:1px}
.shopitem.done .nm{text-decoration:line-through; color:var(--muted); opacity:.65}
.tick{
  flex:0 0 26px; width:26px; height:26px; border-radius:50%; border:2px solid var(--line);
  display:grid; place-items:center; color:transparent; font-size:14px; font-weight:800;
}
.shopitem.done .tick{background:var(--green); border-color:var(--green); color:#fff}
.cat{font-size:12px; font-weight:700; color:var(--green); padding:14px 0 2px; letter-spacing:.5px}

nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; padding-bottom:env(safe-area-inset-bottom);
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
}
nav button{
  flex:1; background:none; color:var(--muted); border-radius:0; padding:7px 0 6px;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; font-weight:600;
}
nav button svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
nav button.on{color:var(--green)}
nav button:active{transform:none; opacity:.7}

.banner{
  background:#FFF4E5; color:#7A4B00; border:1px solid #F0D9B5; border-radius:12px;
  padding:11px 13px; font-size:12.5px; margin-bottom:12px; line-height:1.55;
}
@media (prefers-color-scheme: dark){ .banner{background:#33270F; color:#F0C987; border-color:#4A3A18} }
.empty{text-align:center; color:var(--muted); font-size:13px; padding:22px 0}
</style>
</head>
<body>

<header>
  <h1 id="hTitle">减脂助手</h1>
  <p class="sub" id="hSub">—</p>
</header>

<main>
  <div id="banner" class="banner" style="display:none"></div>

  <!-- 今日 -->
  <section class="tab on" id="t-today">
    <div class="hero">
      <span class="tag" id="todayTag">—</span>
      <h2 id="todayTitle">今天吃什么</h2>
      <p id="todaySum">—</p>
    </div>
    <div class="card" id="todayMeals"></div>
    <div class="card" id="todayTrain"></div>
    <div class="card">
      <h2>今天体重 <small>填一次就行</small></h2>
      <div class="row">
        <div class="field"><label>体重 (kg)</label><input type="number" id="qW" step="0.1" inputmode="decimal" placeholder="77.0"></div>
        <div class="field"><label>腰围 (cm，可空)</label><input type="number" id="qC" step="0.1" inputmode="decimal" placeholder="—"></div>
      </div>
      <div style="margin-top:10px"><button id="qSave">保存今天的记录</button></div>
    </div>
  </section>

  <!-- 菜单 -->
  <section class="tab" id="t-menu">
    <div class="chips" id="dayChips"></div>
    <div class="hero" id="menuHero"></div>
    <div class="card" id="menuMeals"></div>
    <p class="hint" id="menuHint" style="padding:0 4px 8px"></p>
  </section>

  <!-- 菜谱 -->
  <section class="tab" id="t-recipe">
    <p class="hint" id="recipeHint" style="margin:0 0 12px; padding:0 4px">点开看做法。</p>
    <div id="recipeList"></div>
  </section>

  <!-- 清单 -->
  <section class="tab" id="t-shop">
    <div class="card" style="display:flex; align-items:center; gap:12px">
      <div style="flex:1">
        <div style="font-size:14px; font-weight:700" id="shopProgress">采购进度</div>
        <div class="hint" style="margin-top:3px" id="shopSub">买一次约两周量</div>
      </div>
      <button class="sm ghost" id="shopReset" style="width:auto">清空</button>
    </div>
    <div class="card" id="shopList" style="padding-top:6px"></div>
    <p class="hint" style="padding:0 4px">山姆是大包装，买回来当天就按 150g 分装冷冻。商品名随门店季节会变，按品类找即可。</p>
  </section>

  <!-- 打卡 -->
  <section class="tab" id="t-log">
    <div class="stat">
      <div class="box"><div class="k">最新体重</div><div class="v" id="sNow">—<small> kg</small></div></div>
      <div class="box"><div class="k">累计变化</div><div class="v" id="sDelta">—</div></div>
      <div class="box"><div class="k">距目标</div><div class="v" id="sLeft">—</div></div>
    </div>
    <div class="card">
      <h2>体重曲线 <small>虚线 = 目标</small></h2>
      <canvas id="chart" width="600" height="320"></canvas>
      <p class="hint" id="chartHint">至少记录 2 次才会出曲线。每周日填一次 7 天平均值最准。</p>
    </div>
    <div class="card">
      <h2>添加记录</h2>
      <div class="field" style="margin-bottom:10px"><label>日期</label><input type="date" id="lD"></div>
      <div class="row">
        <div class="field"><label>体重 (kg)</label><input type="number" id="lW" step="0.1" inputmode="decimal" placeholder="76.5"></div>
        <div class="field"><label>腰围 (cm)</label><input type="number" id="lC" step="0.1" inputmode="decimal" placeholder="可空"></div>
      </div>
      <div style="margin-top:10px"><button id="lSave">保存</button></div>
    </div>
    <div class="card">
      <h2>历史记录 <small id="logCount"></small></h2>
      <div id="logList"></div>
    </div>
    <div class="card">
      <h2>数据备份</h2>
      <p class="hint" style="margin-top:0">换手机或清除浏览器数据前，把下面这段复制到备忘录存好。</p>
      <textarea id="backup" placeholder="点「导出」生成备份文本"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="btnExport">导出</button>
        <button class="ghost" id="btnImport">导入</button>
      </div>
    </div>
    <p class="hint" style="text-align:center; padding-bottom:8px">数据只存在这台手机里，不上传任何服务器。</p>
  </section>
</main>

</nav>

var KEY = "jianzhi_v1";
var DB = { log: [], shop: {} };
var storageOK = true;

function loadDB(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); if(o && o.log) DB = o; if(!DB.shop) DB.shop = {}; }
  }catch(e){ storageOK = false; }
}
function saveDB(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch(e){ storageOK = false; return false; }
}

/* ---------------- 工具 ---------------- */
function $(s){ return document.querySelector(s); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function todayIdx(){ return (new Date().getDay()+6)%7; }

function currentPhase(){
  var w = Math.floor(daysBetween(START, new Date()) / 7) + 1;
  if (w < 1) w = 1;
  for (var i = 0; i < PHASES.length; i++){
    if (w >= PHASES[i].from && w <= PHASES[i].to) return { w: w, p: PHASES[i] };
  }
  return { w: w, p: {
    name: "维持期", main: 4, aux: 4, rest: 60, steps: "10000", extra: "",
    desc: "12 周走完了，保持每周 4 次力量，热量回到 1900–2100 kcal。"
  }};
}
function ymd(d){
  var m=("0"+(d.getMonth()+1)).slice(-2), dd=("0"+d.getDate()).slice(-2);
  return d.getFullYear()+"-"+m+"-"+dd;
}
function parseYmd(s){ var a=s.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

function renderToday(){
  var i = todayIdx(), m = MENU[i];
  $("#todayTag").textContent = m.mode;
  $("#todayTitle").textContent = m.d + " · 今天吃什么";
  $("#todaySum").textContent = m.total;

  var box = $("#todayMeals");
  box.innerHTML = "";
  m.meals.forEach(function(x){
    var row = el("div","meal");
    var w = el("div","when",x.t);
    var what = el("div","what");
    what.appendChild(el("b",null,x.n));
    what.appendChild(el("span",null,x.i));
    var k = el("div","kcal");
    var kb = el("b",null,x.k+" kcal");
    k.appendChild(kb);
    k.appendChild(el("div",null,"蛋白 "+x.p+"g"));
    row.appendChild(w); row.appendChild(what); row.appendChild(k);
    box.appendChild(row);
  });

  var tb = $("#todayTrain");
  tb.innerHTML = "";
  var cp = currentPhase(), ph = cp.p;

  h.appendChild(el("small", null, "第 " + cp.w + " 周 · " + ph.name));
  tb.appendChild(h);

  var meta = el("p", "hint", "组间休息 " + ph.rest + " 秒 · 今日步数目标 " + ph.steps + " 步"
                             + (ph.desc ? " · " + ph.desc : ""));
  meta.style.margin = "0 0 10px";
  tb.appendChild(meta);

  var list = TRAIN[i];
  if(list){
    list.forEach(function(it){
      var sets = it.main ? ph.main : ph.aux;
      var r = el("div","meal");
      r.appendChild(el("div","when", sets + " 组"));

  }else{
    tb.appendChild(el("p","hint", REST_TIP.replace("当天的步数目标", " " + ph.steps + " 步")));
  }
}

/* ---------------- 清单 ---------------- */
function renderShop(){
  var box = $("#shopList"); box.innerHTML = "";
  var lastCat = null, done = 0, total = 0;
  SHOP.forEach(function(it, idx){
    if(it[0] !== lastCat){
      box.appendChild(el("div","cat",it[0]));
      lastCat = it[0];
    }
    total++;
    var on = !!DB.shop[idx];
    if(on) done++;
    var row = el("div","shopitem"+(on?" done":""));
    var tk = el("div","tick","✓");
    var nm = el("div","nm",it[1]);
    nm.appendChild(el("span",null,it[2]+" · "+it[3]));
    row.appendChild(tk); row.appendChild(nm);
    row.onclick = function(){
      DB.shop[idx] = !on; saveDB(); renderShop();
    };
    box.appendChild(row);
  });
  $("#shopProgress").textContent = "已买 " + done + " / " + total;
  $("#shopSub").textContent = done === 0 ? "买一次约两周量，单周成本 200–300 元" :
    (done >= total ? "全齐了，按 150g 分装冷冻吧" : "还剩 " + (total-done) + " 项");
}

/* ---------------- 打卡 ---------------- */
function getLog(){ return DB.log.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; }); }

function latest(){
  var l = getLog();
  for(var i=l.length-1;i>=0;i--){ if(typeof l[i].w === "number") return l[i]; }
  return null;
}
function firstW(){ return BASE_W; }

function renderStats(){
  var l = getLog(), last = latest();
  var now = last ? last.w : BASE_W;
  var delta = now - BASE_W;
  $("#sNow").innerHTML = (last ? now.toFixed(1) : "—") + "<small> kg</small>";
  var de = $("#sDelta");
  de.textContent = (delta===0 ? "0.0" : (delta>0?"+":"") + delta.toFixed(1));
  de.className = "v " + (delta<0 ? "down" : (delta>0 ? "up":""));
  var left = now - TARGET_W;
  $("#sLeft").innerHTML = left <= 0 ? "达成" : left.toFixed(1) + "<small> kg</small>";
  $("#sLeft").className = "v " + (left<=0 ? "down" : "");
}

function renderChart(){
  var c = $("#chart"), ctx = c.getContext("2d");
  var W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  var l = getLog().filter(function(x){ return typeof x.w === "number"; });
  if(l.length < 2){
    c.style.display = "none";
    $("#chartHint").style.display = "block";
    return;
  }
  c.style.display = "block";
  $("#chartHint").style.display = "none";

  var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var ink = dark ? "#9AA39B" : "#6E756E";
  var grid = dark ? "rgba(255,255,255,.08)" : "rgba(0,0,0,.07)";
  var line = dark ? "#5FBE84" : "#2E8B57";
  var tgt  = dark ? "rgba(95,190,132,.45)" : "rgba(46,139,87,.35)";

  var padL = 44, padR = 26, padT = 14, padB = 30;
  var maxWeeks = 12;
  var weeks = l.map(function(x){ return daysBetween(START, parseYmd(x.d))/7; });
  var wMax = Math.max(maxWeeks, Math.ceil(Math.max.apply(null, weeks)));
  var vals = l.map(function(x){ return x.w; });
  var lo = Math.min.apply(null, vals.concat([TARGET_W])) - 1;
  var hi = Math.max.apply(null, vals.concat([BASE_W])) + 1;

  function X(wk){ return padL + (W-padL-padR) * (wk / wMax); }
  function Y(v){ return padT + (H-padT-padB) * (1 - (v-lo)/(hi-lo)); }

  ctx.strokeStyle = grid; ctx.lineWidth = 1;
  for(var i=0;i<=4;i++){
    var v = lo + (hi-lo)*i/4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillStyle = ink; ctx.font = "18px -apple-system,sans-serif"; ctx.textAlign = "right";
    ctx.fillText(v.toFixed(0), padL-8, y+6);
  }
  ctx.textAlign = "center";
  for(var wk=3; wk<=wMax; wk+=3){
    ctx.fillStyle = ink;
    ctx.fillText(wk + "周", X(wk), H-8);
  }

  // 目标线
  ctx.setLineDash([7,7]); ctx.strokeStyle = tgt; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(X(0), Y(BASE_W)); ctx.lineTo(X(maxWeeks), Y(TARGET_W)); ctx.stroke();
  ctx.setLineDash([]);

  // 实际线
  ctx.strokeStyle = line; ctx.lineWidth = 3.5; ctx.lineJoin = "round";
  ctx.beginPath();
  l.forEach(function(x, i){
    var px = X(daysBetween(START, parseYmd(x.d))/7), py = Y(x.w);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.stroke();

  l.forEach(function(x){
    var px = X(daysBetween(START, parseYmd(x.d))/7), py = Y(x.w);
    ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI*2);
    ctx.fillStyle = line; ctx.fill();
    ctx.strokeStyle = dark ? "#1A201B" : "#fff"; ctx.lineWidth = 2.5; ctx.stroke();
  });
}

function renderLogList(){
  var box = $("#logList"); box.innerHTML = "";
  var l = getLog().reverse();
  $("#logCount").textContent = l.length ? l.length + " 条" : "";
  if(!l.length){ box.appendChild(el("div","empty","还没有记录，先填一次今天的体重。")); return; }
  l.slice(0,10).forEach(function(x){
    var row = el("div","meal");
    row.appendChild(el("div","when", x.d.slice(5)));
    var what = el("div","what");
    what.appendChild(el("b",null,(typeof x.w==="number"? x.w.toFixed(1)+" kg" : "—")));
    if(typeof x.c==="number") what.appendChild(el("span",null,"腰围 "+x.c.toFixed(1)+" cm"));
    row.appendChild(what);
    var k = el("div","kcal");
    var del = el("button","sm ghost","删除");
    del.style.cssText = "width:auto;padding:5px 10px;font-size:12px;color:var(--muted);border-color:var(--line)";
    del.onclick = function(){
      DB.log = DB.log.filter(function(y){ return y.d !== x.d; });
      saveDB(); renderAll();
    };
    k.appendChild(del);
    row.appendChild(k);
    box.appendChild(row);
  });
}

function upsert(dateStr, w, c){
  var found = false;
  DB.log.forEach(function(x){
    if(x.d === dateStr){
      if(typeof w === "number") x.w = w;
      if(typeof c === "number") x.c = c;
      found = true;
    }
  });
  if(!found){
    DB.log.push({ d: dateStr,
      w: (typeof w==="number"? w : null),
      c: (typeof c==="number"? c : null) });
  }
  return saveDB();
}

/* ---------------- 交互 ---------------- */
function num(id){
  var v = $(id).value.trim();
  if(v === "") return null;
  var n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function flash(msg){
  var b = $("#banner");
  b.textContent = msg; b.style.display = "block";
  setTimeout(function(){ b.style.display = "none"; }, 2600);
}

function showTab(name){
  document.querySelectorAll("nav button").forEach(function(x){
    x.classList.toggle("on", x.dataset.tab === name);
  });
  document.querySelectorAll(".tab").forEach(function(x){
    x.classList.toggle("on", x.id === "t-" + name);
  });
  window.scrollTo(0, 0);
}

function renderAll(){
  renderToday(); renderChips(); renderMenu(); renderRecipes(); renderShop();
  renderStats(); renderChart(); renderLogList();
}

function init(){
  loadDB();
  if(!storageOK){
    var b = $("#banner");
    b.textContent = "当前方式打开无法保存数据（浏览器限制本地文件存储）。打卡记录会丢失，建议用局域网地址打开，或只在阅读时使用。";
    b.style.display = "block";
  }

  var now = new Date();
  $("#hSub").textContent = (now.getMonth()+1) + " 月 " + now.getDate() + " 日 · " +
    MENU[todayIdx()].d + " · " + MENU[todayIdx()].mode;
  $("#lD").value = ymd(now);

  var last = latest();
  if(last){
    $("#lW").value = last.w.toFixed(1);
    if(typeof last.c === "number") $("#lC").value = last.c.toFixed(1);
    if(last.d === ymd(now)){ $("#qW").value = last.w.toFixed(1); }
  }
  $("#hTitle").textContent = "减脂助手";

  document.querySelectorAll("nav button").forEach(function(btn){
    btn.onclick = function(){
      var name = btn.dataset.tab;
      showTab(name);
      try { history.replaceState(null, "", name === "today" ? location.pathname : "#" + name); } catch(e){}
    };
  });
  var h = (location.hash || "").replace("#", "");
  if(h && document.getElementById("t-" + h)) showTab(h);

  $("#qSave").onclick = function(){
    var w = num("#qW"), c = num("#qC");
    if(w === null && c === null){ flash("先填一个体重"); return; }
    if(upsert(ymd(new Date()), w, c)){
      $("#qW").value = ""; $("#qC").value = "";
      renderAll(); flash("已保存到打卡记录");
    } else flash("保存失败：" + (storageOK ? "未知原因" : "浏览器不允许本地存储"));
  };

  $("#lSave").onclick = function(){
    var d = $("#lD").value, w = num("#lW"), c = num("#lC");
    if(!d){ flash("选一个日期"); return; }
    if(w === null && c === null){ flash("至少填体重或腰围"); return; }
    if(upsert(d, w, c)){ renderAll(); flash("已保存 " + d); }
    else flash("保存失败：浏览器不允许本地存储");
  };

  $("#shopReset").onclick = function(){
    DB.shop = {}; saveDB(); renderShop(); flash("已清空勾选");
  };

  $("#btnExport").onclick = function(){
    $("#backup").value = JSON.stringify(DB);
    $("#backup").select();
    flash("已生成，长按全选复制");
  };
  $("#btnImport").onclick = function(){
    var t = $("#backup").value.trim();
    if(!t){ flash("先粘贴备份文本"); return; }
    try{
      var o = JSON.parse(t);
      if(!o || !o.log) throw new Error("格式不对");
      DB = { log:o.log, shop:o.shop || {} };
      saveDB(); renderAll(); flash("已导入 " + DB.log.length + " 条记录");
    }catch(e){ flash("导入失败：备份文本不完整"); }
  };

  renderAll();
}

init();
</script>
